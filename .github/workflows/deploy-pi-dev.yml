name: Deploy to RaspPi (Development)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate manual run branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${{ github.ref_name }}" != "develop" ]]; then
            echo "This workflow can only be run manually from the develop branch."
            exit 1
          fi

      - name: Set Environment Variables
        run: |
          echo "ENV_NAME=dev" >> $GITHUB_ENV
          echo "WEB_PORT=81" >> $GITHUB_ENV
          echo "API_PORT=3001" >> $GITHUB_ENV
          echo "DB_PORT=5433" >> $GITHUB_ENV
          echo "PGADMIN_PORT=5051" >> $GITHUB_ENV
          echo "COMPOSE_PROJECT_NAME=climbit_dev" >> $GITHUB_ENV

      - name: Create .env file
        env:
          ENV_FILE_DEV: ${{ secrets.ENV_FILE_DEVELOPMENT }}
        run: |
          rm -f .env
          echo "$ENV_FILE_DEV" > .env

      - name: Ensure persistent uploads volume exists
        run: |
          docker volume create ${COMPOSE_PROJECT_NAME}_backend_uploads >/dev/null

      - name: Build and Start containers
        run: |
          # --pull asegura que las capas base (node:22-alpine, etc) esten sincronizadas
          docker compose -p ${COMPOSE_PROJECT_NAME} build --pull
          docker compose -p ${COMPOSE_PROJECT_NAME} down --remove-orphans
          docker compose -p ${COMPOSE_PROJECT_NAME} up -d

      - name: Clean up unused Docker data
        run: |
          # Limpieza profunda para mantener el disco de la RaspPi optimizado
          docker image prune -f
          docker builder prune -f --filter "until=24h"
